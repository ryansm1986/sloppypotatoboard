# Push a tag like v1.2.0 and this builds the Windows installer + portable exe and
# publishes them as one GitHub release. Installed copies of the app pick it up automatically.
#
# electron-builder only builds here (--publish never); the release is created in a single
# `gh release create` so parallel uploads can never split assets across duplicate releases.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          test "$version" = "$(node -p "require('./package.json').version")" || { echo "::error::Tag $tag does not match package.json version"; exit 1; }
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
          git tag -l --format='%(contents)' "$tag" > notes.md
          files=(release/*.exe release/*.blockmap release/latest.yml)
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" --title "$version" --notes-file notes.md --latest
          fi
